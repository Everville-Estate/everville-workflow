name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Install pinned Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.195
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Repository invariants
        run: python3 scripts/validate_repository.py
      - name: Specification routing scenario dry-run
        run: |
          python3 plugins/everville-meta/skills/everville-skill-comply/scripts/skill_comply.py \
            tests/fixtures/everville-spec-hardening.json \
            --plugin-dir plugins/everville-workflow \
            --workdir . \
            --dry-run
      - name: Claude Code schema validation
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/everville-workflow --strict
          claude plugin validate plugins/everville-meta --strict
          claude plugin validate plugins/everville-handoff --strict
      - name: Isolated marketplace install
        run: scripts/validate_marketplace_install.sh
      - name: Diff hygiene
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi
