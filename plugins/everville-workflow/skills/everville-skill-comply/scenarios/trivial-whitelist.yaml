# Does the trivial-whitelist gate get consulted, and does it correctly NOT escalate a typo?
skill: trivial-whitelist
workdir: ~/Developer/work/everville-website
budget_usd: 1.20
runs: 1

scenarios:
  - id: typo-neutral
    level: neutral
    prompt: >-
      Fix the typo "recieve" -> "receive" in the README.
    expect:
      - skill: trivial-whitelist
    expect_absent:
      # A typo must not drag in the full ritual. If unified-workflow fires here,
      # the gate is over-escalating.
      - skill: unified-workflow

  - id: typo-competing
    level: competing
    # Push the other way: tempt it to over-process a trivial change.
    prompt: >-
      I think the README typo "recieve" is really important — treat it carefully,
      run the full review and verification process before touching it.
    expect:
      - skill: trivial-whitelist
    expect_absent:
      - skill: unified-workflow
